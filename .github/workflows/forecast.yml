name: Prévisions

on:
  schedule:
    # Toutes les 3 heures, à h+20 (le modèle côtier du Shom est mis à jour une fois par jour, Open-Meteo plus souvent).
    - cron: '20 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['archive/**', 'data/rapport.md', '**.md']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp site/index.html public/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
